{% extends "base.html" %}
{% block title %}Delete {{ object.name }} · nightreignbuilds.fyi{% endblock %}
{% block content %}
<div class="auth-card">
    <h1>Delete build?</h1>
    <div class="panel">
        <p>“<strong>{{ object.name }}</strong>” will be gone for good. This can't be undone.</p>
        <form method="post" class="actions">{% csrf_token %}
            <button type="submit" class="button-danger">Delete build</button>
            <a class="button button-ghost" href="{{ object.get_absolute_url }}">Keep it</a>
        </form>
    </div>
</div>
{% endblock %}
