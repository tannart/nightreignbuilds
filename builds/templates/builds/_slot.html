{% load static %}
<div class="slot{% if not relic %} empty{% endif %}">
    {% if relic.icon %}
        <span class="slot-icon"><img class="relic-icon {{ relic.colour }}" src="{% static relic.icon %}" alt="" width="56" height="56"><span class="gem {{ colour }}" title="{{ colour|title }} slot"></span></span>
    {% else %}
        <span class="gem lg {{ colour }}{% if not relic %} empty{% endif %}" title="{{ colour|title }} slot"></span>
    {% endif %}
    <div>
        <span class="slot-label">{{ colour }} slot</span>
        {% if relic %}
            <h3>{{ relic.name }}</h3>
            {% with effects=relic.effects.all %}{% if effects %}
            <ul>{% for effect in effects %}<li{% if effect.is_curse %} class="curse"{% endif %}{% if effect.description %} title="{{ effect.description }}"{% endif %}>{{ effect.name }}</li>{% endfor %}</ul>
            {% endif %}{% endwith %}
        {% else %}
            <h3>Empty</h3>
        {% endif %}
    </div>
</div>
