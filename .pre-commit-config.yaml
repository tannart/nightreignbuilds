repos:
  - repo: local
    hooks:
      - id: black
        name: black
        entry: uv run black
        language: system
        types: [python]
      - id: ruff
        name: ruff
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: uv run mypy .
        language: system
        types: [python]
        pass_filenames: false
      # tflint isn't a Python package so it can't come from uv; this only
      # runs once Terraform files exist (requires `brew install tflint`).
      - id: tflint
        name: tflint
        entry: tflint
        language: system
        files: \.tf$
        pass_filenames: false
